{% extends "base.html" %}

{% block title %}Delete Product | DesiHands{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-5">
                <div class="auth-card bg-white border rounded-3 p-4 p-md-5">
                    <h1 class="h3 mb-3">Delete Product</h1>
                    <p class="text-muted">
                        Are you sure you want to delete <strong>{{ product.product_name }}</strong>?
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button class="btn btn-danger" type="submit">Delete</button>
                            <a class="btn btn-outline-secondary" href="{% url 'core:product_detail' product.id %}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
